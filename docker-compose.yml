services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visioninspect
      POSTGRES_PASSWORD: visioninspect
      POSTGRES_DB: visioninspect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioninspect"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://visioninspect:visioninspect@db:5432/visioninspect
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STORAGE_DIR: /app/storage
      MVTEC_ROOT: /data/mvtec_anomaly_detection
    volumes:
      - storage:/app/storage
      - ./data:/data:ro
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  storage:
